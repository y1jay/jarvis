appId: io.jarvis.desktop
productName: JARVIS
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# 공식 CLI / Agent SDK 는 네이티브 바이너리를 실행하므로 asar 밖으로 풀어 둔다
asarUnpack:
  - node_modules/@anthropic-ai/**
  - node_modules/@openai/**
  - node_modules/@google/gemini-cli/**
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  extendInfo:
    NSCameraUsageDescription: JARVIS 는 손 제스처 인식과 홀로그램 표시를 위해 카메라를 사용합니다.
    NSMicrophoneUsageDescription: JARVIS 는 "자비스" 음성 명령을 듣기 위해 마이크를 사용합니다.
    NSAppleEventsUsageDescription: JARVIS 는 다른 앱을 열고 닫기 위해 시스템 이벤트를 사용합니다.
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: JARVIS
