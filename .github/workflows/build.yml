# Mac / Windows 설치 파일 빌드. 태그(v*)를 올리면 GitHub Releases 에 설치 파일이 자동으로 첨부된다.
# 플랫폼별 네이티브 바이너리(Claude/Codex)가 필요하므로 각 OS 러너에서 npm ci 후 빌드한다.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
      - name: 릴리스에 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
